[package]
name = "omaclackd"
version = "2.0.0"
edition = "2021"
description = "Omaclack keyboard and mouse sound daemon"
license = "MIT"

[[bin]]
name = "omaclackd"
path = "src/main.rs"

[dependencies]
serde_json = "1"
libc = "0.2"
pipewire = { version = "0.10", features = ["v0_3_77"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
